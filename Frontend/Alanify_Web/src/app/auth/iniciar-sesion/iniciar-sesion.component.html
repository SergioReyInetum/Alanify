<div class="login-container">
    <div class="login-form">
      <h2>Inicia de sesión</h2>
      <p class="subtext">Inicia sesión con tu nombre de cuenta</p>
      <form (ngSubmit)="onLogin()">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" placeholder="User Name" required [(ngModel)]="username" name="username">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Password" required [(ngModel)]="password" name="password">
          <a href="#" class="forgot-password" (click)="navigateToSoporte()">¿Olvidaste la contraseña?</a>
        </div>
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" class="checkbox-input"> 
            <span class="checkbox-text">Recordarme</span>
          </label>
        </div>
        <button type="submit" class="btn-primary">Iniciar sesión</button>
      </form>
      <div class="social-login">
        <button class="btn-social google">
          <img src="assets/images/Logo-google-icon-PNG.png" alt="Google Icon"> Iniciar sesión con Google
        </button>
        <button class="btn-social facebook">
          <img src="assets/images/Popular-facebook-Logo-png.png" alt="Facebook Icon"> Iniciar sesión con Facebook
        </button>
      </div>
      <p class="register-link">
        <a href="#" (click)="navigateToCrearCuenta()">Crea una cuenta</a>
      </p>
      <button class="btn-back" (click)="goBack()">⬅ Atrás</button> <!-- Botón debajo del formulario -->
    </div>
    <div class="custom-logo-container">
      <img src="assets/images/logo_alanify_definitivo83.png" alt="AlaniFy Logo" class="logo">
    </div>
  </div>
