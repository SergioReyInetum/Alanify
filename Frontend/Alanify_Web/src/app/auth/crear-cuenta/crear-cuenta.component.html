<div class="register-form">
    <h2>Crear cuenta</h2>
    <form>
      <div class="form-group">
        <label for="email">Dirección de correo electrónico</label>
        <input type="email" id="email" placeholder="" required>
      </div>
      <div class="form-group">
        <label for="username">Nombre usuario</label>
        <input type="text" id="username" placeholder="" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="" required>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirma contraseña</label>
        <input type="password" id="confirm-password" placeholder="" required>
      </div>
      <div class="form-group">
        <label for="country">País de residencia</label>
        <input type="text" id="country" placeholder="" required>
      </div>
      <button type="submit" class="btn-primary" (click)="navigateToTokenValidacion()">Crear cuenta</button>
    </form>
  </div>
