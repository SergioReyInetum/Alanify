<app-nav></app-nav>

<div class="separator"></div>

<div class="content">
    <div class="profile-section">
        <!-- Datos del usuario -->
        <div class="user-data">
            <h2>Datos del usuario</h2>
            <div class="data-item">
                <label>Nombre</label>
                <p>[Nombre del usuario]</p>
            </div>
            <div class="data-item">
                <label>Apellidos</label>
                <p>[Apellidos del usuario]</p>
            </div>
            <div class="data-item">
                <label>Teléfono</label>
                <p>[Teléfono del usuario]</p>
            </div>
            <div class="data-item">
                <label>Email</label>
                <p>[Email del usuario]</p>
            </div>
            <div class="data-item">
                <label>Username</label>
                <p>[Username del usuario]</p>
            </div>
            <div class="data-item">
                <label>Password</label>
                <p>[Password del usuario]</p>
            </div>
        </div>

        <!-- Historial y Carrito -->
        <div class="history-cart">
            <div class="history-content">
                <h2>Historial</h2>
                <!-- Aquí puedes agregar contenido dinámico para el historial -->
                <p>[Historial del usuario]</p>
            </div>
            <div class="cart-section">
                <div class="cart-content">
                    <h3>Carrito</h3>
                    <!-- Aquí puedes agregar contenido dinámico para el carrito -->
                    <p>[Carrito del usuario]</p>
                </div>
            </div>
        </div>
    </div>
</div>
